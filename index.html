<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8edff">
  <meta name="description" content="轨交牵引供电数字孪生仿真工作台，查看直流供电拓扑、资产状态和诊断证据。">
  <title>牵引供电数字孪生 · PHM 工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script src="model.js" defer></script>
  <script src="topology-scene.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="glass-backdrop" aria-hidden="true"></div>
  <a class="skip-link" href="#main">跳到工作区</a>
  <aside class="sidebar" id="sidebar" aria-label="工作台导航">
    <a href="#overview" class="brand" aria-label="牵引供电 PHM 总览">
      <span class="brand-mark" data-icon="bolt"></span>
      <span><strong>轨交 PHM</strong><small>牵引供电数字孪生</small></span>
    </a>
    <div class="workspace-label">工作空间</div>
    <nav class="nav" aria-label="主要">
      <a href="#overview" data-view="overview"><span data-icon="overview"></span>运行总览</a>
      <a href="#assets" data-view="assets"><span data-icon="layers"></span>资产台账</a>
      <a href="#simulation" data-view="simulation"><span data-icon="flask"></span>仿真实验</a>
      <a href="#events" data-view="events"><span data-icon="bell"></span>诊断事件<span class="nav-count" id="nav-count" hidden></span></a>
      <a href="#sources" data-view="sources"><span data-icon="database"></span>数据与模型</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="system-state"><span class="system-icon" data-icon="activity"></span><span><strong>仿真数据源</strong><small>浏览器本地运行</small></span><span class="state-light"></span></div>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="breadcrumbs"><button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="切换导航" aria-expanded="false" data-icon="menu"></button><span class="crumb-root">数字孪生底座</span><span class="crumb-chevron" data-icon="chevron"></span><strong id="breadcrumb">运行总览</strong></div>
      <div class="top-actions">
        <span class="environment"><i></i>仿真环境</span>
        <span class="top-divider"></span>
        <button class="icon-button top-bell" type="button" data-open-view="events" aria-label="查看诊断事件" data-icon="bell"><span id="bell-dot" hidden></span></button>
        <a class="avatar" href="#sources" title="数据与模型" aria-label="查看数据与模型">PH</a>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="event-dialog" aria-labelledby="dialog-heading"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
